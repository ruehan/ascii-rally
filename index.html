<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII World</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07090c; }
  #app canvas { display: block; }
  .hud {
    position: fixed; left: 16px; top: 16px; color: #c8d2dc; pointer-events: none;
    font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre;
    background: rgba(7, 9, 12, .7); padding: 10px 12px; border: 1px solid #2a2e37;
  }
  .hud b { color: #5dff8a; }
  .speed { position: fixed; right: 16px; bottom: 16px; color: #5dff8a;
    font: bold 20px ui-monospace, Menlo, monospace; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud"><b>ASCII WORLD</b> v0.1
WASD / 방향키  운전
C             컬러 ↔ 단색
E             윤곽선 켜기/끄기
+ / -         글자 크기
R             리셋</div>
<div class="speed"><span id="speed">  0</span> km/h</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
