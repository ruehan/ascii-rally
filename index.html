<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage ~/</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1012; }
  #app canvas { display: block; }
  /* Boot screen: plain HTML/CSS so it shows (and animates on the
     compositor) while the main thread builds the world. */
  #boot {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: #0d1012; color: #d6dde3; font: 13px/1.45 ui-monospace, 'SF Mono', Menlo, monospace;
    transition: opacity 0.6s;
  }
  #boot.out { opacity: 0; pointer-events: none; }
  #boot .box { width: min(520px, calc(100vw - 40px)); }
  #boot pre { margin: 0 0 18px; color: #5dff8a; font-size: 12px; line-height: 1.15; }
  #boot .bar { position: relative; height: 4px; background: #1b2226; overflow: hidden; margin: 10px 0 6px; }
  #boot .bar i { position: absolute; inset: 0; width: 40%; background: #5dff8a; animation: boot-slide 1.1s ease-in-out infinite; }
  #boot .status { color: #7d8a94; }
  #boot .start { display: none; }
  #boot.ready .bar, #boot.ready .status { display: none; }
  #boot.ready.ask .start { display: block; }
  #boot .start p { margin: 8px 0; }
  #boot .start .dim { color: #7d8a94; }
  #boot .start .go { color: #5dff8a; margin-top: 16px; animation: boot-blink 1.2s steps(2) infinite; }
  #boot .start button {
    background: none; border: 1px solid #2a3136; color: #d6dde3; font: inherit; padding: 1px 8px; cursor: pointer;
  }
  #boot .start button.on { border-color: #5dff8a; color: #5dff8a; }
  #boot.ask { cursor: pointer; }
  @keyframes boot-blink { 50% { opacity: 0.35; } }
  @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
</style>
</head>
<body>
<div id="app"></div>
<div id="boot">
  <div class="box">
<pre>
 ___ _                    __
/ __| |_ __ _ __ _ ___   / /
\__ \  _/ _` / _` / -_) / /
|___/\__\__,_\__, \___|/_/  ~
             |___/
</pre>
    <div class="status">$ ./build-world --size 1.2km</div>
    <div class="bar"><i></i></div>
    <div class="start"></div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
