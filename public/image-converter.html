<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Converter</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --text: #e6e6e6; --muted: #8a8f98;
    --accent: #7cc4ff; --border: #2a2e37;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 18px; }
  main { display: grid; grid-template-columns: 280px 1fr; gap: 16px; padding: 16px 20px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .controls label { display: block; margin: 12px 0 4px; color: var(--muted); font-size: 12px; }
  .controls input[type=range], .controls select, .controls input[type=text] { width: 100%; }
  .controls input[type=text], .controls select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 6px; font-family: ui-monospace, monospace; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .row label { margin: 0; color: var(--text); font-size: 13px; }
  #drop { border: 2px dashed var(--border); border-radius: 8px; padding: 18px; text-align: center;
    color: var(--muted); cursor: pointer; transition: border-color .15s; }
  #drop.over { border-color: var(--accent); color: var(--accent); }
  #drop img { max-width: 100%; max-height: 140px; display: block; margin: 8px auto 0; border-radius: 4px; }
  button { background: var(--accent); color: #0b1a26; border: 0; border-radius: 4px;
    padding: 8px 12px; font-weight: 600; cursor: pointer; flex: 1; }
  button:disabled { opacity: .4; cursor: default; }
  .output { overflow: auto; min-height: 300px; perspective: 900px; }
  #ascii.tilting { transition: transform .08s linear; transform-origin: center; }
  #ascii { margin: 0; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    line-height: 1; white-space: pre; letter-spacing: 0; }
  .hint { color: var(--muted); font-size: 12px; }
  .val { float: right; color: var(--text); }
</style>
</head>
<body>
<header><h1>이미지 → ASCII 변환기</h1></header>
<main>
  <section class="panel controls">
    <div id="drop">이미지 드래그 또는 클릭<input id="file" type="file" accept="image/*" hidden></div>

    <label>가로 문자 수 <span class="val" id="widthVal">120</span></label>
    <input id="width" type="range" min="20" max="300" value="120">

    <label>글자 크기(px) <span class="val" id="fontVal">8</span></label>
    <input id="font" type="range" min="4" max="20" value="8">

    <label>대비 <span class="val" id="contrastVal">1.0</span></label>
    <input id="contrast" type="range" min="0.5" max="3" step="0.1" value="1">

    <label>문자 세트 (어두움 → 밝음)</label>
    <select id="preset">
      <option value="@%#*+=-:. ">기본</option>
      <option value="$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\|()1{}[]?-_+~<>i!lI;:,&quot;^`'. ">상세 (70자)</option>
      <option value="█▓▒░ ">블록</option>
      <option value="10 ">바이너리</option>
      <option value="custom">직접 입력</option>
    </select>
    <input id="chars" type="text" value="@%#*+=-:. " style="margin-top:6px">

    <div class="row"><input id="invert" type="checkbox"><label for="invert">반전 (밝은 배경용)</label></div>
    <div class="row"><input id="color" type="checkbox"><label for="color">컬러</label></div>

    <div class="row"><input id="relief" type="checkbox"><label for="relief">3D 조명 (마우스 = 빛 방향)</label></div>
    <label>깊이 <span class="val" id="depthVal">4</span></label>
    <input id="depth" type="range" min="1" max="15" value="4">
    <div class="row"><input id="tilt" type="checkbox"><label for="tilt">3D 기울기 (마우스 따라감)</label></div>

    <div class="row">
      <button id="copy" disabled>복사</button>
      <button id="download" disabled>.txt 저장</button>
    </div>
    <p class="hint" id="status">이미지를 올려주세요.</p>
  </section>

  <section class="panel output" id="output"><pre id="ascii"></pre></section>
</main>

<script>
const $ = id => document.getElementById(id);
const els = {
  drop: $('drop'), file: $('file'), width: $('width'), font: $('font'),
  contrast: $('contrast'), preset: $('preset'), chars: $('chars'),
  invert: $('invert'), color: $('color'), ascii: $('ascii'),
  relief: $('relief'), depth: $('depth'), tilt: $('tilt'),
  copy: $('copy'), download: $('download'), status: $('status'),
};
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
let img = null;
let plainText = '';
const light = { x: -0.6, y: -0.6 };  // default: light from top-left

// Monospace chars are ~2x taller than wide; compensate when sampling rows.
const CHAR_ASPECT = 0.5;

function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    els.status.textContent = '이미지 파일이 아닙니다.';
    return;
  }
  const url = URL.createObjectURL(file);
  const image = new Image();
  image.onload = () => {
    img = image;
    els.drop.innerHTML = `${file.name}<img src="${url}" alt="">`;
    els.drop.appendChild(els.file);
    render();
  };
  image.onerror = () => { els.status.textContent = '이미지를 불러오지 못했습니다.'; };
  image.src = url;
}

function render() {
  if (!img) return;
  const cols = +els.width.value;
  const rows = Math.max(1, Math.round(cols * (img.height / img.width) * CHAR_ASPECT));
  canvas.width = cols;
  canvas.height = rows;
  ctx.drawImage(img, 0, 0, cols, rows);
  const { data } = ctx.getImageData(0, 0, cols, rows);

  let chars = els.chars.value || ' ';
  if (els.invert.checked) chars = [...chars].reverse().join('');
  const ramp = [...chars];               // handles multi-byte chars like █
  const n = ramp.length;
  const contrast = +els.contrast.value;
  const useColor = els.color.checked;

  // Pass 1: luminance grid (needed up front so relief can look at neighbours).
  const lumGrid = new Float32Array(cols * rows);
  for (let p = 0; p < cols * rows; p++) {
    const i = p * 4;
    const a = data[i + 3] / 255;
    // Perceived luminance, transparent pixels treated as white.
    let lum = (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) / 255;
    lum = lum * a + (1 - a);
    lumGrid[p] = Math.min(1, Math.max(0, (lum - 0.5) * contrast + 0.5));
  }
  const at = (x, y) =>
    lumGrid[Math.min(rows - 1, Math.max(0, y)) * cols + Math.min(cols - 1, Math.max(0, x))];

  // Relief: brightness = height. Light direction from mouse; z > 0 points at viewer.
  const relief = els.relief.checked;
  const depth = +els.depth.value;
  let lx = light.x, ly = light.y, lz = 0.7;
  const ll = Math.hypot(lx, ly, lz);
  lx /= ll; ly /= ll; lz /= ll;

  const lines = [];
  const html = [];
  for (let y = 0; y < rows; y++) {
    let line = '';
    let hline = '';
    for (let x = 0; x < cols; x++) {
      const p = y * cols + x;
      let v = lumGrid[p];
      let shade = 1;
      if (relief) {
        // Central-difference surface normal. Rows are ~2x taller than columns on screen.
        const dx = (at(x + 1, y) - at(x - 1, y)) * depth;
        const dy = (at(x, y + 1) - at(x, y - 1)) * depth * CHAR_ASPECT;
        const nl = Math.hypot(dx, dy, 1);
        shade = Math.max(0, (-dx * lx - dy * ly + lz) / nl);
        v = Math.min(1, 0.65 * shade + 0.35 * v);
      }
      const ch = ramp[Math.min(n - 1, Math.floor(v * n))];
      line += ch;
      if (useColor) {
        const i = p * 4;
        const f = relief ? 0.35 + shade : 1;
        const r = Math.min(255, data[i] * f | 0);
        const g = Math.min(255, data[i + 1] * f | 0);
        const b = Math.min(255, data[i + 2] * f | 0);
        const safe = ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch === '&' ? '&amp;' : ch;
        hline += `<span style="color:rgb(${r},${g},${b})">${safe}</span>`;
      }
    }
    lines.push(line);
    if (useColor) html.push(hline);
  }

  plainText = lines.join('\n');
  els.ascii.style.fontSize = els.font.value + 'px';
  els.ascii.style.background = els.invert.checked ? '#fff' : 'transparent';
  els.ascii.style.color = els.invert.checked ? '#000' : 'inherit';
  if (useColor) els.ascii.innerHTML = html.join('\n');
  else els.ascii.textContent = plainText;

  els.copy.disabled = els.download.disabled = false;
  els.status.textContent = `${cols} × ${rows} 문자`;
}

// Input wiring
els.drop.addEventListener('click', () => els.file.click());
els.file.addEventListener('change', e => loadFile(e.target.files[0]));
['dragenter', 'dragover'].forEach(t => els.drop.addEventListener(t, e => {
  e.preventDefault(); els.drop.classList.add('over');
}));
['dragleave', 'drop'].forEach(t => els.drop.addEventListener(t, e => {
  e.preventDefault(); els.drop.classList.remove('over');
}));
els.drop.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));
window.addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (item) loadFile(item.getAsFile());
});

els.preset.addEventListener('change', () => {
  if (els.preset.value !== 'custom') els.chars.value = els.preset.value;
  else els.chars.focus();
  render();
});
els.chars.addEventListener('input', () => { els.preset.value = 'custom'; render(); });

for (const [id, fmt] of [['width', v => v], ['font', v => v], ['contrast', v => (+v).toFixed(1)]]) {
  els[id].addEventListener('input', () => { $(id + 'Val').textContent = fmt(els[id].value); render(); });
}
els.invert.addEventListener('change', render);
els.color.addEventListener('change', render);

// 3D: mouse position drives light direction (relief) and CSS tilt.
const output = $('output');
let pending = false;
function scheduleRender() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; render(); });
}
function applyTilt() {
  if (els.tilt.checked) {
    els.ascii.classList.add('tilting');
    els.ascii.style.transform = `rotateY(${light.x * 18}deg) rotateX(${-light.y * 18}deg)`;
  } else {
    els.ascii.classList.remove('tilting');
    els.ascii.style.transform = '';
  }
}
output.addEventListener('mousemove', e => {
  const rect = output.getBoundingClientRect();
  light.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;   // -1 left .. 1 right
  light.y = ((e.clientY - rect.top) / rect.height) * 2 - 1;   // -1 top .. 1 bottom
  applyTilt();
  if (els.relief.checked) scheduleRender();
});
output.addEventListener('mouseleave', () => {
  if (els.tilt.checked) { light.x = light.y = 0; applyTilt(); light.x = light.y = -0.6; }
});
els.relief.addEventListener('change', render);
els.tilt.addEventListener('change', applyTilt);
els.depth.addEventListener('input', () => { $('depthVal').textContent = els.depth.value; render(); });

els.copy.addEventListener('click', async () => {
  await navigator.clipboard.writeText(plainText);
  els.status.textContent = '복사됨!';
});
els.download.addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([plainText], { type: 'text/plain' }));
  a.download = 'ascii.txt';
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
